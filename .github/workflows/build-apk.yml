name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub Actions UI

jobs:
  build:
    name: Build Web App and Compile APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install npm dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Build the Vite React Frontend
      - name: Build Web Application
        run: npm run build

      # 5. Set up Java JDK (Capacitor 7/8 requires Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 6. Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 7. Install Android SDK Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Sync compiled web assets into the Capacitor Android project
      - name: Sync Capacitor Assets
        run: npx cap sync android

      # 9. Build the Android APK using Gradle
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug # Produces a debug APK

      # 10. Upload the resulting APK as a build artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
